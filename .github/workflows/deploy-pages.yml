name: Deploy Gamarjoba to GitHub Pages

on:
  push:
    branches: [claude/georgian-duolingo-app-ygbfn3]
    paths:
      - "gamarjoba/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish gamarjoba/ to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd gamarjoba
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy Gamarjoba site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Enable GitHub Pages for the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "POST /pages -> ${code}"
          if [ "$code" = "409" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}')
            echo "PUT /pages -> ${code}"
          fi
          cat /tmp/pages.json
          case "$code" in 201|204) ;; *) echo "Enabling Pages failed" >&2; exit 1;; esac

      - name: Print site URL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | grep -o '"html_url"[^,]*' || true
